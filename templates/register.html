{% extends "base.html" %}

{% block title %}Register - MindCare Campus Early Warning{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-8 col-lg-6 col-xl-5">
    <div class="card card-custom p-4 p-sm-5">
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
          <i class="bi bi-person-plus-fill fs-3"></i>
        </div>
        <h4 class="fw-bold">Create Campus Account</h4>
        <p class="text-muted small">Join your campus privacy-conscious wellbeing support network</p>
      </div>

      {% if error %}
        <div class="alert alert-danger py-2 px-3 small d-flex align-items-center gap-2 mb-4" role="alert">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <div>{{ error }}</div>
        </div>
      {% endif %}

      <form action="/register" method="POST">
        <div class="mb-3">
          <label class="form-label small fw-bold">Full Name</label>
          <input type="text" name="full_name" class="form-control" placeholder="Jane Doe" required>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold">Institutional Email</label>
          <input type="email" name="email" class="form-control" placeholder="jane@campus.edu" required>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold">Role</label>
          <select name="role" class="form-select">
            <option value="student" selected>Student</option>
            <option value="counsellor">Campus Counsellor</option>
            <option value="admin">Administrator</option>
          </select>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label small fw-bold">Department</label>
            <input type="text" name="department" class="form-control" value="Computer Science">
          </div>
          <div class="col-6">
            <label class="form-label small fw-bold">Academic Year</label>
            <input type="text" name="academic_year" class="form-control" value="3rd Year">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold">Password (min 6 characters)</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 mb-3">
          Complete Registration
        </button>
      </form>

      <div class="text-center text-muted small">
        Already registered? <a href="/login" class="fw-bold text-primary text-decoration-none">Sign In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
